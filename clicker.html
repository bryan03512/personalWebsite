<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clicker</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="clicker.css">
</head>
<body>
  <div class="page-wrap">
    <a class="back-link" href="index.html">&larr; menu</a>

    <div class="window game-window">
      <div class="window-titlebar">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="title-text">clicker.sh</span>
      </div>

      <div class="game-body">
        <p class="score glow" id="score">commits: 0</p>

        <div class="click-zone" id="clickZone">
          <button class="commit-btn" id="clickBtn">
            <span class="commit-icon">&gt;_</span>
            <span>git commit</span>
          </button>
        </div>

        <div class="upgrades">
          <button class="btn upgrade-btn" id="clickUpgradeBtn"></button>
          <button class="btn upgrade-btn" id="autoUpgradeBtn"></button>
        </div>

        <p class="stats" id="stats"></p>

        <button class="btn reset-btn" id="resetBtn">git reset --hard</button>
      </div>
    </div>
  </div>

  <script src="clicker.js"></script>
</body>
</html>
