<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clicker</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="clicker.css">
</head>
<body>
  <div class="page-wrap">
    <a class="back-link" href="index.html">&larr; menu</a>

    <div class="window game-window">
      <div class="window-titlebar">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="title-text">clicker.sh</span>
      </div>

      <div class="game-body">
        <p class="score glow" id="score">commits: 0</p>

        <div class="click-zone" id="clickZone">
          <button class="commit-btn" id="clickBtn">
            <span class="commit-icon">&gt;_</span>
            <span class="commit-label">git commit</span>
          </button>
        </div>

        <p class="stats" id="stats"></p>

        <div class="prestige-bar">
          <div class="prestige-bar-top">
            <span id="prestigeStat">prestige: 0 pts</span>
            <button class="btn prestige-btn" id="prestigeBtn">refactor --prestige</button>
          </div>
          <div class="prestige-progress">
            <div class="prestige-progress-fill" id="prestigeFill"></div>
          </div>
          <span class="prestige-progress-label" id="prestigeProgressLabel"></span>
        </div>

        <div id="offlineBanner" class="offline-banner" hidden></div>

        <div class="buy-mode-row">
          <span class="buy-mode-label">buy:</span>
          <button class="btn buy-mode-btn active" id="buyMode1" data-qty="1">x1</button>
          <button class="btn buy-mode-btn" id="buyMode10" data-qty="10">x10</button>
          <button class="btn buy-mode-btn" id="buyModeMax" data-qty="max">max</button>
        </div>

        <div class="upgrade-section">
          <h3># typing upgrades</h3>
          <div class="upgrade-list" id="clickUpgradeList"></div>
        </div>

        <div class="upgrade-section">
          <h3># ci/cd upgrades</h3>
          <div class="upgrade-list" id="autoUpgradeList"></div>
        </div>

        <button class="btn reset-btn" id="resetBtn">git reset --hard</button>
      </div>
    </div>
  </div>

  <button class="collection-tab" id="collectionTab" aria-label="Toggle collection panel">&#128193; farm</button>

  <div class="collection-backdrop" id="collectionBackdrop"></div>

  <aside class="collection-panel" id="collectionPanel">
    <div class="collection-panel-header">
      <span>your setup</span>
      <button class="collection-close" id="collectionClose">&times;</button>
    </div>

    <div class="collection-section">
      <h3># typing upgrades</h3>
      <div class="collection-list" id="collectionClickList"></div>
    </div>

    <div class="collection-section">
      <h3># ci/cd upgrades</h3>
      <div class="collection-list" id="collectionAutoList"></div>
    </div>
  </aside>

  <button class="collection-tab tree-tab" id="treeTab" aria-label="Toggle prestige tree">&#127795; prestige</button>

  <div class="collection-backdrop" id="treeBackdrop"></div>

  <aside class="collection-panel tree-panel" id="treePanel">
    <div class="collection-panel-header">
      <span>prestige tree &mdash; <span id="treePointsLabel">0</span> pts</span>
      <button class="collection-close" id="treeClose">&times;</button>
    </div>

    <div class="tree-container" id="treeContainer">
      <svg class="tree-lines" id="treeLines"></svg>
      <div class="tree-row" data-row="root"></div>
      <div class="tree-row two-col" data-row="tier1"></div>
      <div class="tree-row two-col" data-row="tier2"></div>
      <div class="tree-row two-col" data-row="tier3"></div>
      <div class="tree-row" data-row="capstone"></div>
    </div>
  </aside>

  <script src="clicker.js"></script>
</body>
</html>
