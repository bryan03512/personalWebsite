<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clicker Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Clicker Game</h1>

    <p class="score" id="score">Score: 0</p>

    <button class="click-btn" id="clickBtn">CLICK ME</button>

    <div class="upgrades">
      <button class="upgrade-btn" id="clickUpgradeBtn"></button>
      <button class="upgrade-btn" id="autoUpgradeBtn"></button>
    </div>

    <p class="stats" id="stats"></p>

    <button class="reset-btn" id="resetBtn">Reset Progress</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
